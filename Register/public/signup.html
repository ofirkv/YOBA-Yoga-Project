<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YOBA • Sign Up</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <section class="card" role="form" aria-labelledby="title">
      <div class="logo">
        <div class="logo-badge">Y</div>
        <div style="font-weight:800; letter-spacing:.3px">YOBA</div>
      </div>
      <h1 id="title" class="h1">Sign up</h1>
      <p class="p">Create your YOBA account</p>

      <form id="signupForm" autocomplete="on">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Ari Ezra" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@yoba.fit" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" required />

        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Repeat password" required />

        <button class="btn btn-primary" type="submit">SIGNUP</button>
        <p class="small">Already have an account? <a class="link" href="./index.html">Login</a></p>
        <div id="error" class="error" aria-live="polite"></div>
        <div id="ok" class="success" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script type="module" src="./js/signup.js"></script>
</body>
</html>
