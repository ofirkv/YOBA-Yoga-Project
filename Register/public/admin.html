<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YOBA • Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container" style="max-width: 980px">
      <div class="header">
        <div class="logo" style="margin: 0">
          <div class="logo-badge">Y</div>
          <div style="font-weight: 800; letter-spacing: 0.3px">
            YOBA • Admin
          </div>
        </div>
        <div class="util">
          <span class="badge">Signed in as <span id="me"></span></span>
          <button id="logout" class="btn btn-ghost">Logout</button>
        </div>
      </div>

      <section class="card">
        <div class="search">
          <input
            id="q"
            type="search"
            placeholder="Search users by name or email"
            aria-label="Search users"
          />
        </div>
        <div class="hr"></div>
        <div style="overflow: auto">
          <table class="table" role="table" aria-label="Users table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
